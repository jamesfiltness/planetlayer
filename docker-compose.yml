services:
  db:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: spatial
      POSTGRES_PASSWORD: spatial
      POSTGRES_DB: spatial
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'spatial']
      interval: 2s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://spatial:spatial@db:5432/spatial
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  data:
